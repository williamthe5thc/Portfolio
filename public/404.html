<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found | W. Jordan Charles</title>
    <script>
      // GitHub Pages serves this file for any URL it has no file for. The
      // site uses HashRouter, so its pages live at <base>/#/<route>, and a
      // path-style link such as /Portfolio/about would otherwise dead-end
      // here. Send it to the matching hash route; the app's own 404 page
      // handles routes that don't exist. The base is the first path segment,
      // so this works on /Portfolio/ and /Portfolio-Staging/ alike. Paths
      // that look like files (a missing PDF or image) are left alone.
      (function () {
        var l = window.location;
        var parts = l.pathname.split('/');
        var route = parts.slice(2).join('/');
        if (!parts[1] || /\.[a-z0-9]+$/i.test(route)) return;
        l.replace('/' + parts[1] + '/#/' + route + l.search + l.hash);
      })();
    </script>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #1e293b;
        background: #f8fafc;
        text-align: center;
        padding: 0 16px;
      }
      a {
        color: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>This file or page doesn't exist.</p>
      <p><a id="home" href="/">Go to the portfolio home page</a></p>
    </main>
    <script>
      var segment = window.location.pathname.split('/')[1];
      if (segment) document.getElementById('home').href = '/' + segment + '/';
    </script>
  </body>
</html>
