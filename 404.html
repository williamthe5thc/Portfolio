<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page Not Found - W. Jordan Charles</title>
    <script>
        // Single Page App fallback - handles GitHub Pages routing
        // This redirects all 404s to your index.html where React routing takes over
        (function() {
            var pathSegments = window.location.pathname.split('/');
            var repoName = 'Portfolio'; // Your GitHub repo name
            var path = window.location.pathname;
            
            // Check if we're on GitHub Pages
            if (pathSegments[1] === repoName) {
                path = path.substr(repoName.length + 1);
            }
            
            // Store the path for redirect after React loads
            localStorage.setItem('404-redirect', path);
            
            // Construct the redirect URL
            var redirectUrl = window.location.origin + 
                (pathSegments[1] === repoName ? '/' + repoName : '') + '/';
            
            // Add a small delay to ensure the user sees the message
            setTimeout(function() {
                window.location.href = redirectUrl;
            }, 1500);
        })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }
        .container {
            text-align: center;
            padding: 2rem;
            animation: fadeIn 0.5s ease-out;
        }
        h1 {
            font-size: 6rem;
            margin: 0;
            color: #0284c7;
            animation: float 3s ease-in-out infinite;
        }
        h2 {
            font-size: 2rem;
            color: #1e293b;
            margin: 1rem 0;
        }
        p {
            color: #64748b;
            margin: 1rem 0 2rem;
            max-width: 24rem;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #0284c7;
            color: white;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
            transition: all 0.2s;
            border: 2px solid transparent;
        }
        .button:hover {
            background-color: #0369a1;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .button:active {
            transform: translateY(0);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .loading {
            margin-top: 1rem;
            color: #64748b;
            font-size: 0.875rem;
            opacity: 0;
            animation: fadeIn 0.5s ease-out 0.5s forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>
            Sorry, we couldn't find the page you're looking for. 
            You'll be redirected to the homepage automatically.
        </p>
        <a href="/" class="button">Return to Homepage</a>
        <div class="loading">Redirecting...</div>
    </div>
</body>
</html>
