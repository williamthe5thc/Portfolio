<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="W. Jordan Charles - Instructional Designer Portfolio showcasing expertise in e-learning development and educational technology integration." />
    <meta name="keywords" content="instructional design, e-learning, educational technology, portfolio, Jordan Charles" />
    <meta name="author" content="W. Jordan Charles" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    
    <!-- Open Graph Meta Tags for social sharing -->
    <meta property="og:title" content="W. Jordan Charles - Instructional Designer Portfolio" />
    <meta property="og:description" content="Showcasing expertise in instructional design, e-learning development, and educational technology integration." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://williamthe5thc.github.io/EDPS_WilliamCharles/" />
    
    <!-- Title -->
    <title>W. Jordan Charles - Instructional Designer Portfolio</title>
    
    <!-- Preload critical assets -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    
    <!-- Custom Styles -->
    <style>
      /* Minimal styling for initial load */
      body {
        margin: 0;
        padding: 0;
        background-color: floralwhite;
      }
      #root {
        min-height: 100vh;
      }
      .loading {
        display: none;
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #root:empty + .loading {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Fallback loading state -->
    <div class="loading">
      <h1>Loading Portfolio...</h1>
      <p>Please wait while we prepare W. Jordan Charles's portfolio.</p>
    </div>
    <!-- Entry point script -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
