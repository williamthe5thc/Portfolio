<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Relative paths, not root-relative. Vite leaves "./" as written, and it
      resolves against the page URL; with HashRouter the document is always
      served from the deploy base, so these work under /Portfolio/ and
      /Portfolio-Staging/ alike. The previous "/vite.svg" was the starter
      template's icon: it had no base prefix and the file does not exist, so
      it 404'd on both deployments.
    -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="./favicon-96x96.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Send only the origin to other sites (LinkedIn, GitHub, EmailJS), never
      the full URL, and nothing on a downgrade to http. This is the browser
      default today; stating it keeps it if the default ever changes. No
      Content-Security-Policy: the inline Google Analytics snippet below
      would need 'unsafe-inline' or a hash kept in step with it.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>W. Jordan Charles - Instructional Designer &amp; Learning Technologist</title>

    <!--
      Static share metadata. LinkedIn, Slack, Teams and iMessage previews do
      not run JavaScript, and the #/ route never reaches the server, so this
      head is all they ever see for any link to the site. data-rh marks the
      tags as Helmet's: once the app runs, the SEO component replaces them
      with the current page's values instead of adding duplicates.
      Canonical stays static (no data-rh): crawlers drop the fragment, so the
      root is the canonical URL for every route.
    -->
    <meta data-rh="true" name="description" content="Portfolio of W. Jordan Charles: instructional design, learning experience design and learning technology. Case studies, interactive demos and resumes." />
    <meta data-rh="true" name="author" content="W. Jordan Charles" />
    <meta data-rh="true" property="og:type" content="website" />
    <meta data-rh="true" property="og:site_name" content="W. Jordan Charles Portfolio" />
    <meta data-rh="true" property="og:title" content="W. Jordan Charles - Instructional Designer &amp; Learning Technologist" />
    <meta data-rh="true" property="og:description" content="Portfolio of W. Jordan Charles: instructional design, learning experience design and learning technology. Case studies, interactive demos and resumes." />
    <meta data-rh="true" property="og:url" content="https://williamthe5thc.github.io/Portfolio/" />
    <meta data-rh="true" property="og:image" content="https://williamthe5thc.github.io/Portfolio/og-image.jpg" />
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" property="og:image:alt" content="W. Jordan Charles, Instructional Designer. Needs analysis, course design, LMS implementation. M.Ed., University of Utah." />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <meta data-rh="true" name="twitter:title" content="W. Jordan Charles - Instructional Designer &amp; Learning Technologist" />
    <meta data-rh="true" name="twitter:description" content="Portfolio of W. Jordan Charles: instructional design, learning experience design and learning technology. Case studies, interactive demos and resumes." />
    <meta data-rh="true" name="twitter:image" content="https://williamthe5thc.github.io/Portfolio/og-image.jpg" />
    <meta data-rh="true" name="twitter:image:alt" content="W. Jordan Charles, Instructional Designer. Needs analysis, course design, LMS implementation. M.Ed., University of Utah." />
    <link rel="canonical" href="https://williamthe5thc.github.io/Portfolio/" />

    <!-- Built only from facts in src/content (siteData.ts, education.ts); keep in step with them. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "W. Jordan Charles",
        "jobTitle": "Instructional Designer",
        "url": "https://williamthe5thc.github.io/Portfolio/",
        "sameAs": [
          "https://linkedin.com/in/jordan-charles",
          "https://github.com/williamthe5thc"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Salt Lake City",
          "addressRegion": "Utah",
          "addressCountry": "US"
        },
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "University of Utah" },
          { "@type": "CollegeOrUniversity", "name": "Brigham Young University - Idaho" }
        ],
        "knowsAbout": [
          "Instructional Design",
          "Learning Experience Design",
          "Learning Technology"
        ]
      }
    </script>

    <!--
      Google tag (gtag.js). send_page_view: false because the app sends every
      page view itself (GoogleAnalytics.tsx), including the first one, with
      the route as the page path. Letting config send one as well counted the
      landing page twice.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-LG6RT04XLW"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LG6RT04XLW', {
        send_page_view: false,
        cookie_domain: 'williamthe5thc.github.io'
      });
    </script>
  </head>
  <body>
    <!--
      For crawlers and AI tools that don't run JavaScript. The bio is a copy of
      siteConfig.bio in src/content/siteData.ts; test/content/llms-txt.test.ts
      fails if the two differ.
    -->
    <noscript>
      <h1>W. Jordan Charles, Instructional Designer &amp; Learning Technologist</h1>
      <p>I'm an instructional designer who works where learning design meets the technology that delivers it. At WeYouth, a youth nonprofit, I chose the learning platform and build and run its courses. Before that I ran a needs analysis for Chartway Credit Union's certification program, automated course setup at NACVA, and helped build a graduate AI and law course in Canvas. I have a psychology research background and an M.Ed. in Instructional Design and Educational Technology from the University of Utah.</p>
      <p>This site needs JavaScript. A plain-text summary of every project is at
        <a href="./llms.txt">llms.txt</a>. Documents that open without JavaScript:
        <a href="./case-studies/ficep-needs-analysis.pdf">FiCEP needs analysis</a>,
        <a href="./demos/ai-law-course/index.html">AI &amp; Law design record</a>,
        <a href="./case-studies/waltz-formative-evaluation.pdf">Waltz evaluation</a>,
        <a href="./demos/professional-communication-training/story.html">Storyline course</a>,
        <a href="./demos/nacva-automation/index.html">NACVA automation demo</a>.</p>
      <p><a href="https://linkedin.com/in/jordan-charles">LinkedIn</a> &middot;
        <a href="https://github.com/williamthe5thc">GitHub</a></p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
